[package]
name = "sermon_shorts"
version = "0.4.0-beta.1"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
aes-gcm = "0.11.1"
anyhow = "1.0.104"
base64 = "0.23.1"
cpal = "0.18.2"
eframe = "0.37.0"
egui_extras = { version = "0.37", features = ["svg", "image"] }
getrandom = "0.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
num-bigint = "0.4"
md5 = { package = "md-5", version = "0.11.0" }
regex = "1.13.1"
rfd = "0.18.0"
ringbuf = "0.6.0"
rustybuzz = "0.20.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.10"
sha2 = "0.11.1"
tiny-skia = "0.12.0"
ttf-parser = "0.25.1"
ureq = { version = "2", features = ["json"] }
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Threading"] }
