# rust 가지를 푸시하면 맥(Apple 칩·Intel) 앱을 빌드하고 실행 시험한 뒤 ZIP·DMG 를 내려받을 수 있게 둔다.
# 릴리스에 올리는 일은 사람이 확인한 뒤 따로 한다 (Electron 판 release.yml 은 main 에만 있다).
name: Rust Mac

on:
  push:
    branches: [rust]

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64, label: arm64 }
          - { runner: macos-15-intel, arch: x64, label: intel }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 구글 OAuth 클라이언트 넣기 (실행 파일 안으로)
        env:
          GOOGLE_CLIENT_JSON: ${{ secrets.GOOGLE_CLIENT_JSON }}
        run: if [ -n "$GOOGLE_CLIENT_JSON" ]; then printf '%s' "$GOOGLE_CLIENT_JSON" > assets/google-client.json; echo 넣음; else echo 없음; fi
      - name: 빌드
        run: cargo build --release
      - name: 계산 시험 (공개 저장소에 있는 자료로)
        run: cargo test --release --test bgm_parity --test llm_parity --test settings_parity --test snap_parity --test ytmeta_parity --test mac_crypt_parity --test delta
      - name: 서명 인증서 넣기 (업데이트해도 같은 앱으로 보이게)
        env:
          MAC_SIGN_P12: ${{ secrets.MAC_SIGN_P12 }}
          MAC_SIGN_PASSWORD: ${{ secrets.MAC_SIGN_PASSWORD }}
        run: |
          if [ -z "$MAC_SIGN_P12" ]; then echo "인증서 없음: 임시 서명"; exit 0; fi
          KC="$RUNNER_TEMP/sign.keychain-db"; KP="$(uuidgen)"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          printf '%s' "$MAC_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security import "$RUNNER_TEMP/sign.p12" -k "$KC" -P "$MAC_SIGN_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/sign.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          HASH="$(security find-certificate -c "SermonShorts Code Signing" -Z "$KC" | awk '/SHA-1 hash/{print $NF}')"
          echo "인증서 지문: $HASH"
          echo "MAC_SIGN_HASH=$HASH" >> "$GITHUB_ENV"
          echo "MAC_SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"
      - name: 앱 묶음·ZIP·DMG
        run: bash tools/mac_bundle.sh ${{ matrix.arch }} ${{ matrix.label }}
      - name: 바뀐 부분만 받는 업데이트용 덩어리·파일 목록
        run: |
          VER="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          cargo run --release --example make_delta -- dist/SermonShorts.app "$VER" mac-${{ matrix.label }} dist
      - name: 실행 시험 (화면·내보내기)
        run: bash tools/mac_smoke.sh dist/SermonShorts.app smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.label }}
          path: smoke/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.label }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.json
          if-no-files-found: error
          retention-days: 14