# v로 시작하는 태그(예: v0.2.1)를 푸시하면 Windows 에서 빌드해 GitHub 릴리스에 올린다.
# Mac 빌드는 당분간 쉰다 (다시 하려면 mac 작업을 되살리고 release 의 needs 에 넣는다).
# latest.yml·blockmap 은 앱 자동 업데이트가 읽으므로 꼭 함께 올린다.
# 수동 실행(workflow_dispatch)에서 tag를 넣으면 그 태그의 릴리스에 파일을 다시 올린다. 비우면 빌드만 시험한다.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '파일을 올릴 기존 릴리스 태그 (예: v0.2.0). 비우면 빌드만'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: 태그와 package.json 버전 확인
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          [ "$v" = "$TAG" ] || { echo "태그 $TAG 와 package.json 버전 $v 가 다릅니다"; exit 1; }

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ffmpeg·ffprobe·yt-dlp 받기
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full.7z -OutFile ff.7z
          7z e ff.7z -obin ffmpeg.exe ffprobe.exe -r -y
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile bin/yt-dlp.exe
          Get-ChildItem bin
      # 유튜브 업로드용 구글 OAuth 클라이언트(데스크톱 앱). 저장소 Secrets 에 GOOGLE_CLIENT_JSON 이 있을 때만 넣는다.
      # 없으면 사용자가 [설정 → 유튜브 → 고급]에서 자기 클라이언트를 넣어야 로그인할 수 있다.
      - name: 구글 OAuth 클라이언트 넣기
        shell: pwsh
        env:
          GOOGLE_CLIENT_JSON: ${{ secrets.GOOGLE_CLIENT_JSON }}
        run: |
          if ($env:GOOGLE_CLIENT_JSON) { Set-Content -Path src/main/google-client.json -Value $env:GOOGLE_CLIENT_JSON -Encoding utf8NoBOM; 'google-client.json 넣음' } else { 'GOOGLE_CLIENT_JSON 없음: 기본 클라이언트 없이 빌드' }
      - name: 설치 파일·ZIP 빌드
        run: npx electron-builder --win nsis zip --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

  release:
    needs: [windows]
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: SHA256 목록
        working-directory: out
        run: sha256sum * | tee SHA256SUMS.txt
      # 바뀐 점: 지난 릴리스 태그 이후 커밋 메시지에서 "- " 로 시작하는 줄을 모은다 (없으면 제목에서 "vX.Y.Z: " 를 뺀 것)
      - name: 릴리스 설명 만들기
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          range="${prev:+$prev..}$TAG"
          notes="$RUNNER_TEMP/notes.md"
          {
            echo '## 바뀐 점'
            for c in $(git rev-list --no-merges "$range"); do
              items=$(git log -1 --format=%b "$c" | grep -E '^- ' || true)
              if [ -n "$items" ]; then echo "$items"
              else echo "- $(git log -1 --format=%s "$c" | sed -E 's/^v[0-9][^:]*: *//')"; fi
            done
            echo
            echo '## 내려받기'
            echo '- **Windows**: `SermonShorts-Setup-*-x64.exe` ← 보통 이것을 받으세요 · 압축 해제판 `*-win-x64.zip`'
            echo
            echo '이미 설치한 PC 는 프로그램을 열면 새 버전을 알아서 받아 설치합니다.'
            echo '코드 서명이 없는 베타입니다. Windows는 SmartScreen에서 "추가 정보 → 실행"을 누르세요. Mac 판은 당분간 만들지 않습니다.'
            echo '파일 확인용 해시는 `SHA256SUMS.txt`에 있습니다. 자세한 내용: [설치 안내](https://github.com/hahadark/sermon-shorts/blob/main/docs/INSTALL.md)'
            if [ -n "$prev" ]; then echo; echo "**전체 변경 내역**: https://github.com/${{ github.repository }}/compare/$prev...$TAG"; fi
          } > "$notes"
          cat "$notes"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: SermonShorts ${{ inputs.tag || github.ref_name }}
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          overwrite_files: true
          files: out/*
          body_path: ${{ runner.temp }}/notes.md
