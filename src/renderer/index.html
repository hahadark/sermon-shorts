<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' file:; script-src 'self' file:; style-src 'self' 'unsafe-inline' file:; img-src 'self' file: data: blob:; media-src file: blob: ssbgm: https://*.googlevideo.com https://incompetech.com https://*.incompetech.com https://upload.wikimedia.org https://archive.org https://*.archive.org https://files.freemusicarchive.org https://freemusicarchive.org https://ccmixter.org https://*.ccmixter.org; font-src 'self' file: data:">
  <title>SermonShorts</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="icons.css">
  <link rel="stylesheet" href="materials.css">
</head>
<body>
  <nav id="rail" aria-label="작업 공간">
    <div class="rail-logo" title="SermonShorts"><img src="../../assets/images/app-icon.png" alt="SermonShorts"></div>
    <button class="rail-item on ico i-clapperboard" type="button" data-rail="editor" aria-current="page" title="쇼츠 편집">쇼츠 편집</button>
    <button id="btnMaterials" class="rail-item ico i-book-open" type="button" title="설교로 소그룹 자료·QT·성경 퀴즈·설교 요약·묵상카드·가정예배지 만들기">교인 자료</button>
    <button class="rail-item ico i-music" type="button" data-rail="music" title="배경음악 고르기·구간·페이드">배경음악</button>
    <button class="rail-item ico i-palette" type="button" data-rail="theme" title="쇼츠 테마 편집">테마</button>
    <button class="rail-item ico i-plug" type="button" data-rail="ai" title="챗GPT·클로드·제미나이 연결">AI 연결</button>
    <span class="rail-spacer"></span>
    <button class="rail-item ico i-circle-help" type="button" data-rail="guide" title="사용 설명서">설명서</button>
    <button id="btnSettings" class="rail-item ico i-settings" type="button" title="설정 (Ctrl+,)" aria-label="설정">설정</button>
  </nav>
  <div id="appMain">
  <header id="topbar">
    <div class="brand"><span class="app-title">쇼츠 편집</span></div>
    <nav class="menubar" aria-label="메뉴">
      <div class="menu">
        <button class="menu-btn" aria-haspopup="true" aria-expanded="false">파일</button>
        <div class="menu-pop" role="menu" aria-label="파일">
          <button id="btnOpen" class="menu-item ico i-film" role="menuitem">영상 파일 열기<kbd>Ctrl+Shift+O</kbd></button>
          <button id="btnYoutube" class="menu-item ico i-square-play" role="menuitem" title="유튜브에서 가져오기 (Ctrl+U)">유튜브에서 가져오기<kbd>Ctrl+U</kbd></button>
          <div class="menu-sep" role="separator"></div>
          <button id="btnOpenProject" class="menu-item ico i-folder-open" role="menuitem">프로젝트 열기<kbd>Ctrl+O</kbd></button>
          <button class="menu-item ico i-save" data-cmd="save" role="menuitem">저장<kbd>Ctrl+S</kbd></button>
          <button class="menu-item ico i-save-all" data-cmd="save-as" role="menuitem">다른 이름으로 저장<kbd>Ctrl+Shift+S</kbd></button>
          <div class="menu-sep" role="separator"></div>
          <button class="menu-item ico i-share" data-cmd="export" role="menuitem">내보내기 (MP4·SRT)<kbd>Ctrl+E</kbd></button>
        </div>
      </div>
      <div class="menu">
        <button class="menu-btn" aria-haspopup="true" aria-expanded="false">편집</button>
        <div class="menu-pop" role="menu" aria-label="편집">
          <button class="menu-item ico i-undo-2" data-cmd="undo" role="menuitem">실행 취소<kbd>Ctrl+Z</kbd></button>
          <button class="menu-item ico i-redo-2" data-cmd="redo" role="menuitem">다시 실행<kbd>Ctrl+Y</kbd></button>
          <div class="menu-sep" role="separator"></div>
          <button class="menu-item ico i-eye-off" data-cmd="toggle-hide" role="menuitem">지운 부분 숨기기·보이기<kbd>H</kbd></button>
          <button class="menu-item ico i-wand-sparkles" data-cmd="auto-clean" role="menuitem">자동 정리 (군말·반복)<kbd>Ctrl+Shift+C</kbd></button>
          <button class="menu-item ico i-fold-horizontal" data-cmd="gaps" role="menuitem">말 사이 공백 없애기</button>
        </div>
      </div>
      <div class="menu">
        <button class="menu-btn" aria-haspopup="true" aria-expanded="false">자막</button>
        <div class="menu-pop" role="menu" aria-label="자막">
          <button id="btnTranscribe" class="menu-item ico i-captions" role="menuitem" title="열린 영상의 음성을 인식해 자막을 만듭니다">자막 만들기 (음성 인식)</button>
          <button class="menu-item ico i-spell-check" data-cmd="ai-correct" role="menuitem">AI 용어 교정<kbd>Ctrl+Shift+T</kbd></button>
          <div class="menu-sep" role="separator"></div>
          <button class="menu-item ico i-sliders-horizontal" data-cmd="caption-settings" role="menuitem">자막 길이·컷 설정</button>
        </div>
      </div>
      <div class="menu">
        <button class="menu-btn" aria-haspopup="true" aria-expanded="false">AI</button>
        <div class="menu-pop" role="menu" aria-label="AI">
          <button id="btnAiConnect" class="menu-item ico i-plug" role="menuitem">AI 연결 (챗GPT·클로드·제미나이)</button>
          <button id="btnAiRecommend" class="menu-item ico i-sparkles" role="menuitem">AI 쇼츠 추천 (제미나이 키)<kbd>Ctrl+Shift+U</kbd></button>
          <button class="menu-item ico i-book-open" data-cmd="materials" role="menuitem">교인 자료 만들기 (소그룹·QT·퀴즈·요약·카드)</button>
          <div class="menu-sep" role="separator"></div>
          <button class="menu-item ico i-message-square" data-cmd="toggle-chat" role="menuitem">AI 편집 대화 보이기·숨기기</button>
        </div>
      </div>
      <div class="menu">
        <button class="menu-btn" aria-haspopup="true" aria-expanded="false">도움말</button>
        <div class="menu-pop" role="menu" aria-label="도움말">
          <button id="btnUserGuide" class="menu-item ico i-book-open" role="menuitem">사용 설명서</button>
          <button class="menu-item ico i-keyboard" data-cmd="shortcuts" role="menuitem">단축키<kbd>F1</kbd></button>
          <button id="btnSysCheck" class="menu-item ico i-stethoscope" role="menuitem">시스템 점검</button>
          <div class="menu-sep" role="separator"></div>
          <button class="menu-item ico i-settings" data-cmd="settings" role="menuitem">설정<kbd>Ctrl+,</kbd></button>
        </div>
      </div>
    </nav>
    <div class="quick" role="toolbar" aria-label="빠른 실행">
      <button id="btnSave" class="btn ghost icon-only ico i-save" title="저장 (Ctrl+S)" aria-label="저장"></button>
      <button class="btn ghost icon-only ico i-undo-2" data-cmd="undo" title="실행 취소 (Ctrl+Z)" aria-label="실행 취소"></button>
      <button class="btn ghost icon-only ico i-redo-2" data-cmd="redo" title="다시 실행 (Ctrl+Y)" aria-label="다시 실행"></button>
    </div>
    <div id="fileName" class="file-name">열린 영상 없음</div>
    <div id="updateBar" class="update-bar hidden">
      <span id="updateMsg"></span>
      <button id="updateAction" class="btn sm primary hidden"></button>
      <button id="updateClose" class="btn sm" title="닫기">✕</button>
    </div>
    <div class="top-right">
      <button id="btnExport" class="btn primary ico i-share" disabled>내보내기</button>
    </div>
  </header>

  <main id="workspace">
    <section id="leftCol">
      <div id="stageWrap">
        <div id="stage">
          <div id="stageInner">
            <div class="tpl-video" id="tplVideoBox">
              <video id="video" preload="auto" playsinline></video>
              <div id="videoEmpty" class="video-empty">영상을 열어 주세요</div>
            </div>
            <canvas id="tplCanvas" width="1080" height="1920" style="position: absolute; top:0; left:0; pointer-events: none;"></canvas>
          </div>
        </div>
      </div>
      <div id="transport">
        <div class="transport-row">
          <button id="btnPlay" class="btn play ico i-play" disabled>재생</button>
          <div class="timecode"><span id="curTime">00:00.000</span> <span class="sep">/</span> <span id="durTime">00:00.000</span></div>
          <span id="timeMode" class="time-mode"></span>
        </div>
        <input id="seek" type="range" min="0" max="1000" step="1" value="0" disabled aria-label="재생 위치">
      </div>
      <section id="templatePanel" class="design-card" aria-label="디자인과 배경음악">
        <div class="card-head card-tabs" role="tablist">
          <button id="tabDesign" class="card-tab on ico i-palette" type="button" role="tab" aria-selected="true">디자인</button>
          <button id="tabMusic" class="card-tab ico i-music" type="button" role="tab" aria-selected="false">배경음악</button>
          <button id="btnChurchMore" class="btn sm ghost icon-only ico i-settings card-head-btn" type="button" title="교회 정보 자세히 (설교자 목록·자주 쓰는 말)" aria-label="교회 정보 자세히"></button>
        </div>
        <div id="designPane" class="card-pane">
        <div class="field">
          <label for="selTheme">테마</label>
          <div class="field-inline"><select id="selTheme"></select><button id="btnEditTheme" class="btn sm ico i-pencil" title="테마 편집기 열기">편집</button></div>
        </div>
        <div class="field">
          <label for="inpTitle">제목</label>
          <input type="text" id="inpTitle" placeholder="설교 제목 (줄바꿈 / · 강조 *말*)" title="제목 가운데 ' / '를 넣으면 화면에서 줄이 바뀌고, *별표*로 감싼 말은 테마의 강조 색으로 보입니다.">
        </div>
        <div class="field">
          <label for="inpVerse">성경 구절</label>
          <input type="text" id="inpVerse" placeholder="예: 마태복음 6:13">
        </div>
        <div class="field">
          <label for="selSpeaker">설교자</label>
          <div class="field-inline"><select id="selSpeaker"></select><input type="text" id="inpSpeaker" placeholder="직접 입력" style="display:none;"><button id="btnSaveSpeaker" class="btn sm icon-only ico i-plus" type="button" title="이 설교자를 목록에 저장" aria-label="설교자 목록에 저장" hidden></button></div>
        </div>
        <div class="field">
          <label for="inpChurch">교회</label>
          <div class="field-inline"><button id="btnChurchLogo" class="logo-btn" type="button" title="로고 이미지 바꾸기" aria-label="로고 이미지 바꾸기"><img id="imgChurchLogo" alt=""></button><input type="text" id="inpChurch" maxlength="60" placeholder="교회 이름" title="고치면 바로 미리보기에 반영되고 설정에도 저장됩니다"><button id="btnChurchShow" class="btn sm icon-only ico i-eye-off" type="button" aria-pressed="false" title="쇼츠에 교회 이름·로고 보이기" aria-label="쇼츠에 교회 이름·로고 보이기"></button></div>
        </div>
        <button id="btnSaveTemplate" class="btn" hidden>템플릿 저장 (미리보기 반영)</button>
      
        </div>
        <div id="bgmPane" class="card-pane bgm-pane" hidden>
          <div id="bgmNone" class="bgm-none">
            <p>잔잔한 피아노·찬송가 연주처럼 설교 쇼츠에 많이 쓰는 <b>저작권 공개 음악</b>을 골라 넣습니다. 음악은 앱에 들어 있지 않고 인터넷에서 바로 재생합니다.</p>
            <button id="btnBgmPick" class="btn primary ico i-list-music" type="button">음악 고르기</button>
          </div>
          <div id="bgmOn" class="bgm-on" hidden>
            <div class="bgm-now">
              <button id="btnBgmPlay" class="btn icon-only ico i-play" type="button" title="영상과 함께 듣기 (Space)" aria-label="영상과 함께 듣기"></button>
              <div class="bgm-name"><b id="bgmTitle"></b><span id="bgmSub"></span></div>
              <button id="btnBgmChange" class="btn sm" type="button">바꾸기</button>
              <button id="btnBgmRemove" class="btn sm ghost icon-only ico i-x" type="button" title="음악 빼기" aria-label="음악 빼기"></button>
            </div>
            <div class="bgm-wave"><canvas id="bgmWave" title="파란 손잡이를 끌어 쓸 구간을 고르세요"></canvas><div id="bgmWaveMsg" class="bgm-wave-msg"></div></div>
            <div class="bgm-row"><span class="bgm-k">구간</span><input id="bgmA" class="bgm-t" aria-label="구간 시작"> ~ <input id="bgmB" class="bgm-t" aria-label="구간 끝"><button id="btnBgmListen" class="btn sm ico i-play" type="button">구간 듣기</button></div>
            <div class="bgm-row bgm-len" id="bgmLen"></div>
<div class="bgm-row bgm-dl" id="bgmDl" hidden></div>
            <div class="bgm-row"><span class="bgm-k">맞추기</span><div class="bgm-seg" id="bgmAlign"><button type="button" data-align="start" title="영상이 시작할 때 음악도 시작">처음에 시작</button><button type="button" data-align="end" title="영상이 끝날 때 음악도 끝나도록">끝에 끝남</button></div></div>
            <div class="bgm-row"><span class="bgm-k">페이드</span>인 <input id="bgmFi" class="bgm-n" type="number" min="0" max="30" step="0.5">초 · 아웃 <input id="bgmFo" class="bgm-n" type="number" min="0" max="30" step="0.5">초</div>
            <div class="bgm-row"><span class="bgm-k">크기</span><input id="bgmVol" type="range" min="0" max="100" step="1"><span id="bgmVolLbl" class="bgm-vl"></span></div>
            <div class="bgm-credit" id="bgmCredit"></div>
          </div>
        </div>
      </section>
    </section>

    <section id="rightCol">
      <div id="transcriptPanel">
        <div id="transcriptBody" class="placeholder">자막 생성 후 여기에 자막이 표시됩니다</div>
      </div>
      <div id="waveWrap">
        <canvas id="waveCanvas"></canvas>
        <div id="waveStatus" class="wave-status">영상을 열면 파형이 표시됩니다</div>
      </div>
    </section>
  </main>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="waveform.js"></script>
  <script src="../shared/linebreak.js"></script>

  <script src="../shared/crop.js"></script>
  <script src="template.js"></script>

  <script src="project.js"></script>
  <script src="exporter.js"></script>
  <script src="import.js"></script>
  <script src="settings-ui.js"></script>
  <script src="church-ui.js"></script>
  <script src="syscheck-ui.js"></script>
  <script src="ai-ui.js"></script>
  <script src="../shared/caret.js"></script>
  <script src="../shared/caption-edit.js"></script>
  <script src="../shared/disfluency.js"></script>
  <script src="tidy.js"></script>
  <script src="caption-blocks.js"></script>
  <script src="editor.js"></script>
  <script src="playback.js"></script>
  <script src="keymap.js"></script>
  <script src="project-validation.js"></script>
  <script src="guide-capture.js"></script>
  <script src="theme-check.js"></script>
  <script src="batch-check.js"></script>
  <script src="batch15-check.js"></script>
  <script src="app.js"></script>
  <script src="theme-editor.js"></script>
  <script src="../shared/chat-plan.js"></script>
  <script src="../shared/gaps.js"></script>
  <script src="../shared/bgm.js"></script>
  <script src="../shared/bgm-catalog.js"></script>
<script src="../shared/bgm-peaks.js"></script>
  <script src="bgm-ui.js"></script>
  <script src="../shared/materials.js"></script>
  <script src="materials-doc.js"></script>
  <script src="materials-ui.js"></script>
  <script src="chat-ui.js"></script>
  <script src="update-ui.js"></script>
  <script src="layout.js"></script>
</body>
</html>
